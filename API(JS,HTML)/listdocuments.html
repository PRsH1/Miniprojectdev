<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>eformsign 문서 목록 조회 API</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --input-bg: #f9fafb;
            --code-bg: #1e1e1e;
            --code-text: #d4d4d4;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 40px;
            font-weight: 800;
            font-size: 2.25rem;
        }

        .section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        .section h2 {
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--bg-color);
            font-size: 1.5rem;
            color: #374151;
            margin-bottom: 25px;
        }

        .grid-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4b5563;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--input-bg);
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Radio & Checkbox Styling */
        .check-radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 10px 0;
        }

        .check-radio-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            cursor: pointer;
            background: #fff;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .check-radio-group label:hover {
            background-color: #f3f4f6;
        }

        .check-radio-group input {
            margin-right: 8px;
            accent-color: var(--primary-color);
        }

        /* Buttons */
        button {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Info & Status */
        .info-box {
            background-color: #eff6ff;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 4px 4px 0;
            font-size: 0.9rem;
            color: #1e3a8a;
        }

        /* Result Area */
        .result-area {
            margin-top: 20px;
            background: var(--code-bg);
            color: var(--code-text);
            padding: 20px;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .result-area p { margin-top: 0; color: #9cdcfe; }

        /* 결과 보기 (표 | JSON) */
        .list-view { margin-top: 20px; }
        .lv-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
        .lv-tabs { display: inline-flex; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .lv-tabs .lv-tab { width: auto; margin: 0; padding: 8px 16px; border-radius: 0; background: #fff; color: #374151; font-size: 0.9rem; font-weight: 600; }
        .lv-tabs .lv-tab:hover { background: #eef2ff; }
        .lv-tabs .lv-tab.active { background: var(--primary-color); color: #fff; }
        .lv-toolbar .lv-btn { width: auto; display: inline-block; margin: 0; padding: 8px 14px; font-size: 0.9rem; background: #fff; color: #1f2937; border: 1px solid #c7ccd4; }
        .lv-toolbar .lv-btn:hover { background: #eef3fd; border-color: var(--primary-color); color: var(--primary-color); }
        .lv-toolbar .lv-btn:disabled { opacity: .45; cursor: not-allowed; }
        .lv-range { font-size: 0.9rem; color: #374151; font-weight: 600; margin-left: auto; }
        .lv-table-wrap { overflow-x: auto; border: 1px solid var(--border-color); border-radius: 8px; background: #fff; max-height: 640px; overflow-y: auto; }
        .lv-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        .lv-table th, .lv-table td { padding: 8px 10px; border-bottom: 1px solid var(--border-color); text-align: left; vertical-align: top; }
        .lv-table th { background: #f9fafb; position: sticky; top: 0; z-index: 1; white-space: nowrap; color: #374151; }
        .lv-table td.mono { font-family: Consolas, Monaco, monospace; font-size: 0.8rem; word-break: break-all; }
        .lv-table td.nowrap { white-space: nowrap; }
        .lv-table td.title { word-break: break-word; min-width: 160px; }
        .lv-table .lv-link { display: inline-block; margin: 0 4px 4px 0; padding: 2px 8px; border: 1px solid #c7ccd4; border-radius: 5px; font-size: 0.8rem; color: #1f2937; text-decoration: none; white-space: nowrap; }
        .lv-table .lv-link:hover { border-color: var(--primary-color); color: var(--primary-color); background: #eef3fd; }
        .lv-empty { padding: 24px; text-align: center; color: #6b7280; }
        .lv-status { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 0.78rem; font-weight: 600; background: #f3f4f6; color: #374151; white-space: nowrap; }
        .lv-status.s-003 { background: #e6f4ea; color: #137333; }
        .lv-status.s-002 { background: #e8f0fe; color: #1a56db; }

        /* Custom URL Input Transition */
        #customUrlGroup {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>eformsign 문서 목록 조회 API</h1>

        <div class="section" id="tokenSection">
            <h2>1. Access Token 발급</h2>
            
            <div class="grid-row">
                <div class="form-group">
                    <label for="envSelection">환경 선택 (Target Environment)</label>
                    <select id="envSelection">
                        <option value="op_saas">운영 (SaaS)</option>
                        <option value="csap">공공 (CSAP)</option>
                        <option value="custom">직접 입력 (Custom URL)</option>
                    </select>
                </div>
                <div class="form-group" id="customUrlGroup" style="display:none;">
                    <label for="customBaseUrl">Custom Base URL</label>
                    <input type="text" id="customBaseUrl" placeholder="예: https://api.myservice.com">
                </div>
            </div>

            <div class="info-box" id="urlDisplay">
                </div>

            <div class="grid-row">
                <div class="form-group">
                    <label for="apiKey">API-KEY</label>
                    <input type="text" id="apiKey" placeholder="발급받은 API Key 입력">
                </div>
                <div class="form-group">
                    <label for="user_id_token">User ID (Member ID)</label>
                    <input type="text" id="user_id_token" placeholder="계정 ID 입력">
                </div>
            </div>

            <div class="form-group">
                <label>인증 방식 (Secret Key Type)</label>
                <div class="check-radio-group">
                    <label><input type="radio" name="secretKeyMethod" value="signature" checked> Signature 방식</label>
                    <label><input type="radio" name="secretKeyMethod" value="bearer"> Bearer Token 방식</label>
                </div>
            </div>

            <div class="form-group">
                <label id="secretKeyLabel" for="privateKeyHex">비밀 키 (Secret key, Hex)</label>
                <input type="text" id="privateKeyHex" placeholder="예: 30... (Signature 방식)">
            </div>

            <button id="btnGetToken" onclick="withLoading(this, getAccessToken)">Access Token 발급</button>
            <div class="form-group" style="display:flex;gap:8px;margin-top:10px;">
                <button type="button" onclick="openCredentialSaveModal()" style="width:auto;flex:1;">인증 저장</button>
                <button type="button" onclick="openCredentialLoadModal()" style="width:auto;flex:1;">인증 불러오기</button>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label for="accessToken">발급된 Access Token</label>
                <input type="text" id="accessToken" readonly style="background-color: #e5e7eb; cursor: not-allowed;">
            </div>

            <div id="tokenResult" class="result-area" style="display:none;"></div>
        </div>

        <div class="section" id="documentListSection">
            <h2>2. 문서 목록 조회</h2>
            <div class="info-box">
                 위에서 발급받은 Access Token이 Authorization 헤더에 자동으로 포함됩니다.
            </div>

            <div class="form-group">
                <label>옵션 설정 (Query String)</label>
                <div class="check-radio-group">
                    <label><input type="checkbox" id="include_external_token"> 사용자 Token 포함</label>
                    <label><input type="checkbox" id="include_fields"> 필드 포함</label>
                    <label><input type="checkbox" id="include_histories"> 문서 이력 포함</label>
                    <label><input type="checkbox" id="include_next_status"> 다음 단계 정보</label>
                    <label><input type="checkbox" id="include_previous_status"> 이전 단계 정보</label>
                </div>
            </div>

            <div class="grid-row">
                <div class="form-group">
                    <label for="docType">문서 상태 (Type)</label>
                    <select id="docType">
                        <option value="01">01: 진행 중</option>
                        <option value="02">02: 처리할 문서</option>
                        <option value="03">03: 완료 문서</option>
                        <option value="04">04: 전체 문서</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="limit">조회 개수 (Limit)</label>
                    <input type="number" id="limit" value="50" min="1">
                </div>
            </div>

            <div class="grid-row">
                <div class="form-group">
                    <label for="titleAndContent">제목 + 내용 검색</label>
                    <input type="text" id="titleAndContent" placeholder="검색어 입력">
                </div>
                 <div class="form-group">
                    <label for="batchId">일괄 작성 ID (Batch ID)</label>
                    <input type="text" id="batchId" placeholder="Batch ID 검색">
                </div>
            </div>

            <div class="grid-row">
                <div class="form-group">
                    <label for="title">제목 검색</label>
                    <input type="text" id="title" placeholder="제목만 검색">
                </div>
                <div class="form-group">
                    <label for="content">내용 검색</label>
                    <input type="text" id="content" placeholder="내용만 검색">
                </div>
            </div>

            <div class="grid-row">
                <div class="form-group">
                    <label for="formId">템플릿 ID (Form ID)</label>
                    <input type="text" id="formId" placeholder="특정 템플릿 ID">
                </div>
                 <div class="form-group">
                    <label for="outsider_expired">만료 여부</label>
                    <select id="outsider_expired">
                        <option value="">선택 안함</option>
                        <option value="true">True (만료됨)</option>
                        <option value="false">False (만료안됨)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="skip">건너뛸 문서 수 (Skip)</label>
                <input type="number" id="skip" value="0" min="0">
                <small style="color:#6b7280;">결과 아래 [이전]/[다음] 버튼을 누르면 Limit 단위로 자동 계산됩니다.</small>
            </div>

            <div class="form-group">
                <label>템플릿 ID 필터링 옵션</label>
                <div class="check-radio-group">
                    <label><input type="radio" name="templateOption" value="unused" checked> 사용 안 함</label>
                    <label><input type="radio" name="templateOption" value="used"> 사용 함</label>
                </div>
            </div>

            <div class="form-group" id="templateIdsGroup" style="display:none;">
                <label for="template_ids">템플릿 ID 목록 (콤마 구분)</label>
                <input type="text" id="template_ids" placeholder="예: id1, id2, id3">
            </div>

            <button id="btnListDocuments" onclick="withLoading(this, () => listDocuments())">문서 목록 조회 실행</button>
            <div id="result"></div>

            <!-- 조회 성공 시 표시: [표 | JSON] 탭 + 페이지 이동 + CSV -->
            <div id="listView" class="list-view" style="display:none;">
                <div class="lv-toolbar">
                    <div class="lv-tabs" role="tablist">
                        <button type="button" class="lv-tab active" data-view="table" role="tab" aria-selected="true">표</button>
                        <button type="button" class="lv-tab" data-view="json" role="tab" aria-selected="false">JSON</button>
                    </div>
                    <button type="button" class="lv-btn" id="btnPrevPage" onclick="goPage(-1)">◀ 이전</button>
                    <button type="button" class="lv-btn" id="btnNextPage" onclick="goPage(1)">다음 ▶</button>
                    <button type="button" class="lv-btn" id="btnExportCsv" onclick="exportCsv()" title="현재 페이지를 CSV로 저장 (UTF-8 BOM, Excel 호환)">CSV 내보내기</button>
                    <span class="lv-range" id="pageRange"></span>
                </div>
                <div id="tableView" class="lv-table-wrap">
                    <table class="lv-table">
                        <thead>
                            <tr><th>문서 ID</th><th>제목</th><th>상태</th><th>생성일</th><th>최종 수정일</th><th>동작</th></tr>
                        </thead>
                        <tbody id="docTableBody"></tbody>
                    </table>
                </div>
                <div id="jsonView" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.5.25/jsrsasign-all-min.js" integrity="sha384-CYM1EjcB6PBH9xEVtC9Mbegj0ZIphHj14fUBspgRcPBqZeGsjqyu242Sh9P4BNPa" crossorigin="anonymous"></script>
    <script src="/assets/js/token-issuer.js"></script>
    <script src="/assets/js/result-panel.js"></script>
    <script src="/assets/js/api-error.js"></script>
    <script src="/assets/js/csv-export.js"></script>
    <script>
        // 기본 URL 맵 (Base URL만 저장)
        const baseUrlMap = {
            op_saas: 'https://kr-api.eformsign.com',
            csap: 'https://www.gov-eformsign.com/Service'
        };

        // 엔드포인트 상수
        const PATH_LIST = '/v2.0/api/list_document';

        // 현재 선택된 환경의 Base URL을 가져오는 함수
        function getBaseUrl() {
            const env = $('#envSelection').val();
            if (env === 'custom') {
                let customUrl = $('#customBaseUrl').val().trim();
                // 끝에 슬래시가 있다면 제거
                return customUrl.replace(/\/$/, ''); 
            }
            return baseUrlMap[env];
        }

        // 화면 UI 업데이트 (URL 표시 등)
        function updateUrlDisplay() {
            const env = $('#envSelection').val();
            const $customGroup = $('#customUrlGroup');
            
            if (env === 'custom') {
                $customGroup.show();
                const currentCustom = $('#customBaseUrl').val().trim();
                if(currentCustom) {
                    $('#urlDisplay').text(`Target Base URL: ${currentCustom}`);
                } else {
                    $('#urlDisplay').text(`Target Base URL: (직접 입력해 주세요)`);
                }
            } else {
                $customGroup.hide();
                $('#urlDisplay').text(`Target Base URL: ${baseUrlMap[env]}`);
            }
        }

        // 초기화 및 이벤트 바인딩
        $(document).ready(function() {
            updateUrlDisplay();
            
            $('#envSelection').change(updateUrlDisplay);
            $('#customBaseUrl').on('input', updateUrlDisplay);

            $('input[name="secretKeyMethod"]').change(() => {
                const m = $('input[name="secretKeyMethod"]:checked').val();
                $('#secretKeyLabel').text(m === 'signature' ? '비밀 키 (Secret key, Hex)' : '비밀 토큰 (Bearer Token)');
                $('#privateKeyHex').attr('placeholder', m === 'signature' ? '예: 30... (Signature 방식)' : '예: test (Bearer token 방식)');
            });

            $('input[name="templateOption"]').change(function() {
                $('#templateIdsGroup').toggle($(this).val() === 'used');
            });
        });

        // 1. Access Token 발급
        async function getAccessToken() {
            const execTime = Date.now();
            const apiKey = $('#apiKey').val().trim();
            const privateKey = $('#privateKeyHex').val().trim();
            const memberId = $('#user_id_token').val().trim();
            const baseUrl = getBaseUrl();

            if (!baseUrl) { alert('API 호출 URL을 확인해주세요. (직접 입력 시 URL 필수)'); return; }
            if (!apiKey || !privateKey || !memberId) { alert('필수 입력란(API Key, Secret Key, User ID)을 모두 채워주세요.'); return; }

            let signature;
            if ($('input[name="secretKeyMethod"]:checked').val() === 'signature') {
                try {
                    const keyObj = KEYUTIL.getKeyFromPlainPrivatePKCS8Hex(privateKey);
                    const sig = new KJUR.crypto.Signature({ alg: 'SHA256withECDSA' });
                    sig.init(keyObj);
                    sig.updateString(execTime.toString());
                    signature = sig.sign();
                } catch (e) { alert('서명 생성 오류: ' + e); return; }
            } else {
                signature = 'Bearer ' + privateKey;
            }

            // 서버·외부 응답 문자열은 .text()로만 렌더링한다 (XSS 방지)
            $('#tokenResult').show().empty().append($('<pre>').text('토큰 발급 요청 중...'));

            const result = await window.issueAccessToken({ domain: baseUrl, apiKey, memberId, signature, execTime });
            if (result.ok) {
                $('#accessToken').val(result.token);
                $('#tokenResult').empty().append($('<pre>').text(JSON.stringify(result.data, null, 2)));
            } else {
                $('#tokenResult').empty().append(
                    $('<pre>').css('color', '#ff6b6b').text(`에러: ${result.message || '알 수 없는 오류'}`)
                );
            }
        }

        // 2. 문서 목록 조회
        // 문서 상태(current_status.status_type) → 한글 라벨. 모르는 코드는 코드 그대로 표시한다.
        const STATUS_LABELS = {
            '001': '임시 저장',
            '002': '진행 중',
            '003': '완료'
        };
        const DOC_INFO_PAGE = '/API(JS,HTML)/DocumentInfo.html';
        const DOC_DOWNLOAD_PAGE = '/API(JS,HTML)/DocumentDownload.html';
        const CSV_HEADERS = ['문서 ID', '제목', '상태', '생성일', '최종 수정일'];

        // 마지막으로 성공한 조회 결과 (페이지 이동·CSV 내보내기에 사용)
        let lastPage = null; // { docs, skip, limit, total, data }
        let currentView = 'table';

        function statusCode(doc) {
            const st = doc && doc.current_status ? doc.current_status.status_type : '';
            return st === undefined || st === null ? '' : String(st);
        }

        function statusText(doc) {
            const code = statusCode(doc);
            if (!code) return '-';
            return STATUS_LABELS[code] ? `${STATUS_LABELS[code]} (${code})` : code;
        }

        function docRow(doc) {
            return [
                doc && doc.id != null ? String(doc.id) : '',
                doc && doc.document_name != null ? String(doc.document_name) : '',
                statusText(doc),
                CsvExport.formatDate(doc && doc.created_date),
                CsvExport.formatDate(doc && doc.updated_date)
            ];
        }

        function readInt(selector, fallback, min) {
            const n = parseInt(String($(selector).val()).trim(), 10);
            return Number.isFinite(n) && n >= min ? n : fallback;
        }

        function setView(view) {
            currentView = view === 'json' ? 'json' : 'table';
            $('.lv-tab').each(function () {
                const on = $(this).data('view') === currentView;
                $(this).toggleClass('active', on).attr('aria-selected', on ? 'true' : 'false');
            });
            $('#tableView').toggle(currentView === 'table');
            $('#jsonView').toggle(currentView === 'json');
        }

        function makeCell(text, className) {
            const td = document.createElement('td');
            if (className) td.className = className;
            td.textContent = text;
            return td;
        }

        // 표 렌더링 — 문서 제목 등 외부 문자열은 textContent로만 넣는다
        function renderTable(docs) {
            const tbody = document.getElementById('docTableBody');
            tbody.textContent = '';
            if (!docs.length) {
                const tr = document.createElement('tr');
                const td = makeCell('조회된 문서가 없습니다.', 'lv-empty');
                td.colSpan = 6;
                tr.appendChild(td);
                tbody.appendChild(tr);
                return;
            }
            const frag = document.createDocumentFragment();
            docs.forEach(doc => {
                const [id, title, status, created, updated] = docRow(doc);
                const tr = document.createElement('tr');
                tr.appendChild(makeCell(id || '-', 'mono'));
                tr.appendChild(makeCell(title || '-', 'title'));

                const stTd = document.createElement('td');
                const badge = document.createElement('span');
                const code = statusCode(doc);
                badge.className = 'lv-status' + (/^[0-9]{3}$/.test(code) ? ' s-' + code : '');
                badge.textContent = status;
                stTd.appendChild(badge);
                tr.appendChild(stTd);

                tr.appendChild(makeCell(created || '-', 'nowrap'));
                tr.appendChild(makeCell(updated || '-', 'nowrap'));

                const act = document.createElement('td');
                act.className = 'nowrap';
                if (id) {
                    [[DOC_INFO_PAGE, '정보', '문서 정보 조회 (새 탭)'], [DOC_DOWNLOAD_PAGE, '다운로드', '문서 다운로드 (새 탭)']].forEach(([page, label, tip]) => {
                        const a = document.createElement('a');
                        a.className = 'lv-link';
                        a.href = `${page}?document_id=${encodeURIComponent(id)}`;
                        a.target = '_blank';
                        a.rel = 'noopener';
                        a.title = tip;
                        a.textContent = label;
                        act.appendChild(a);
                    });
                } else {
                    act.textContent = '-';
                }
                tr.appendChild(act);
                frag.appendChild(tr);
            });
            tbody.appendChild(frag);
        }

        function renderPager() {
            const p = lastPage;
            const count = p.docs.length;
            const from = count ? p.skip + 1 : 0;
            const to = p.skip + count;
            let text;
            if (typeof p.total === 'number') {
                text = count
                    ? `총 ${p.total.toLocaleString()}건 중 ${from.toLocaleString()}–${to.toLocaleString()}`
                    : `총 ${p.total.toLocaleString()}건 · 이 페이지에 문서 없음`;
            } else {
                text = count ? `${from.toLocaleString()}–${to.toLocaleString()}번째` : '이 페이지에 문서 없음';
            }
            $('#pageRange').text(text);
            $('#btnPrevPage').prop('disabled', p.skip <= 0);
            // 총 건수를 알면 그 기준으로, 모르면 받은 건수가 limit보다 적을 때 마지막 페이지로 본다
            const hasNext = typeof p.total === 'number' ? to < p.total : count >= p.limit;
            $('#btnNextPage').prop('disabled', !hasNext || count === 0);
            $('#btnExportCsv').prop('disabled', count === 0);
        }

        // [이전]/[다음] — skip을 limit 단위로 자동 계산해 같은 조건으로 다시 조회한다
        // (withLoading은 끝날 때 버튼의 disabled를 클릭 전 값으로 되돌리므로, 마지막 페이지에서 [다음]이
        //  다시 켜지는 문제를 피하려고 이전/다음 버튼은 여기서 직접 잠그고 끝난 뒤 renderPager로 상태를 정한다)
        let pageBusy = false;
        async function goPage(direction) {
            if (!lastPage || pageBusy) return;
            pageBusy = true;
            $('#btnPrevPage, #btnNextPage').prop('disabled', true);
            try {
                const limit = readInt('#limit', lastPage.limit, 1);
                $('#skip').val(Math.max(0, lastPage.skip + direction * limit));
                await listDocuments();
            } finally {
                pageBusy = false;
                if (lastPage) renderPager();
            }
        }

        // 현재 페이지를 CSV로 (UTF-8 BOM 포함 — Excel 한글 깨짐 방지)
        function exportCsv() {
            if (!lastPage || !lastPage.docs.length) return;
            CsvExport.download(`listdocuments_skip${lastPage.skip}`, CSV_HEADERS, lastPage.docs.map(docRow));
        }

        function listDocuments() {
            // withLoading이 요청 완료까지 버튼을 잠그도록 Promise를 반환한다
            const token = $('#accessToken').val().trim();
            const baseUrl = getBaseUrl();

            if (!token) { alert('Access Token을 먼저 발급받아주세요.'); return; }
            if (!baseUrl) { alert('URL 설정이 올바르지 않습니다.'); return; }

            const limit = readInt('#limit', NaN, 1);
            if (!Number.isFinite(limit)) { alert('조회 개수(Limit)는 1 이상의 숫자로 입력해 주세요.'); return; }
            const skip = readInt('#skip', 0, 0);
            $('#limit').val(limit);
            $('#skip').val(skip);

            let url = baseUrl + PATH_LIST;

            const qs = {
                include_external_token: $('#include_external_token').is(':checked'),
                include_fields: $('#include_fields').is(':checked'),
                include_histories: $('#include_histories').is(':checked'),
                include_next_status: $('#include_next_status').is(':checked'),
                include_previous_status: $('#include_previous_status').is(':checked')
            };
            url += '?' + Object.entries(qs).map(([k, v]) => `${k}=${v}`).join('&');

            ResultPanel.renderStatus('#result', '조회 중...', [`Request URL: ${url}`, `skip ${skip} · limit ${limit}`]);

            // API 명세상 limit·skip은 숫자 문자열로 보낸다
            const body = {
                type: $('#docType').val(),
                title_and_content: $('#titleAndContent').val().trim(),
                title: $('#title').val().trim(),
                content: $('#content').val().trim(),
                limit: String(limit),
                outsider_expired: $('#outsider_expired').val(),
                skip: String(skip)
            };

            const fid = $('#formId').val().trim();
            if (fid) body.form_id = fid;

            const batchId = $('#batchId').val().trim();
            if (batchId) body.batch_id = batchId;

            if ($('input[name="templateOption"]:checked').val() === 'used') {
                const ids = $('#template_ids').val().split(',').map(s => s.trim()).filter(s => s);
                if (ids.length) body.template_ids = ids;
            }

            return fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(body)
            })
            .then(async res => {
                const text = await res.text().catch(() => '');
                if (!res.ok) {
                    $('#listView').hide();
                    renderApiError('#result', { status: res.status, bodyText: text, url, title: '조회 실패 (Fail)' });
                    return;
                }
                let data;
                try {
                    data = JSON.parse(text);
                } catch (_) {
                    $('#listView').hide();
                    renderApiError('#result', { status: res.status, bodyText: text, url, title: '응답 해석 실패' });
                    return;
                }
                const docs = data && Array.isArray(data.documents) ? data.documents : [];
                const rawTotal = data ? data.total_rows : undefined;
                const totalNum = Number(rawTotal);
                lastPage = {
                    docs,
                    skip,
                    limit,
                    total: rawTotal !== undefined && rawTotal !== null && rawTotal !== '' && Number.isFinite(totalNum) ? totalNum : null,
                    data
                };

                // 요약 줄만 #result에 두고, 표·JSON은 아래 탭에서 보여 준다
                ResultPanel.renderStatus('#result', `조회 완료 (Success) · ${docs.length}건`, [`Request URL: ${url}`]);
                // 문서 제목·필드 값은 외부 입력값이므로 반드시 텍스트로 표시 (ResultPanel은 textContent 사용)
                ResultPanel.render('#jsonView', data, {
                    title: `원본 응답 (JSON) · ${docs.length}건`,
                    status: 'ok',
                    filename: 'listdocuments',
                    meta: [`Request URL: ${url}`, `skip ${skip} · limit ${limit}`]
                });
                renderTable(docs);
                renderPager();
                $('#listView').show();
                setView(currentView);
            })
            .catch(err => {
                // CORS·도메인 오타·네트워크 실패
                $('#listView').hide();
                renderApiError('#result', { error: err, url, title: '조회 실패 (Fail)' });
            });
        }

        $(document).on('click', '.lv-tab', function () { setView($(this).data('view')); });
    </script>
