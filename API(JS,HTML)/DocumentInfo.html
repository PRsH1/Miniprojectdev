<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>eformsign 문서 API 정보 조회</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.5.25/jsrsasign-all-min.js"></script>
    <script src="/assets/js/token-issuer.js"></script>
    <script src="/assets/js/result-panel.js"></script>
    <script src="/assets/js/api-error.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 30px auto; background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2, h3 { margin-top: 0; }
        h2 { border-bottom: 1px solid #ddd; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, button, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { cursor: pointer; background-color: #007bff; color: white; border: none; transition: background-color 0.2s; }
        button:hover { background-color: #0056b3; }
        .radio-group { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
        .radio-group label { font-weight: normal; margin: 0; }
        .section { margin-bottom: 30px; }
        #tokenResult, .result-box { margin-top: 15px; background: #f7f7f7; padding: 10px; border: 1px solid #ddd; white-space: pre-wrap; word-break: break-all; font-size: 0.9em; max-height: 400px; overflow-y: auto; }
        .result-box pre { white-space: pre-wrap; word-break: break-all; margin: 0; }
        .url-display { font-size: 0.8em; color: #666; margin-bottom: 10px; word-break: break-all; }
        .url-display #dynamicDocId { color: #007bff; font-weight: bold; }

        .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; }
        .checkbox-group label {
            display: inline-block; padding: 8px 12px; background-color: #e9ecef;
            border: 1px solid #ced4da; border-radius: 4px; font-weight: normal;
            cursor: pointer; transition: all 0.2s ease-in-out; user-select: none;
        }
        .checkbox-group input[type="checkbox"] { display: none; }
        .checkbox-group label.selected { background-color: #007bff; color: white; border-color: #007bff; }

        /* --- 추가 스타일: 커스텀 도메인 입력창 --- */
        #customDomainContainer { margin-top: 10px; display: none; }
        #customDomainContainer input { background-color: #fff3cd; border-color: #ffeeba; } /* 눈에 띄게 노란 배경 */
    </style>
</head>
<body>
    <div class="container">
        <h1>eformsign 문서 API 정보 조회 API 테스트</h1>
        
        <div class="section" id="tokenSection">
            <h2>Access Token 발급</h2>
            <div class="form-group">
                <label for="envSelection">환경 선택:</label>
                <select id="envSelection">
                    <option value="op_saas">운영 (SaaS)</option>
                    <option value="csap">공공 (CSAP)</option>
                    <option value="custom">직접 입력 (Custom Domain)</option>
                </select>

                <div id="customDomainContainer">
                    <input type="text" id="customDomainInput" placeholder="예: https://api.myservice.com (프로토콜 포함)">
                    <small style="color: #856404;">* http:// 또는 https:// 를 포함하여 입력해주세요.</small>
                </div>
            </div>

            <div class="url-display" id="tokenUrlDisplay"></div>
            
            <div class="form-group">
                <label for="apiKey">API-KEY:</label>
                <input type="text" id="apiKey" placeholder="API-KEY 입력">
            </div>
            <div class="form-group">
                <label>비밀 키 입력 방식:</label>
                <div class="radio-group">
                    <label><input type="radio" name="secretKeyMethod" value="signature" checked> Signature 방식</label>
                    <label><input type="radio" name="secretKeyMethod" value="bearer"> Bearer token 방식</label>
                </div>
            </div>
            <div class="form-group">
                <label id="secretKeyLabel" for="privateKeyHex">비밀 키 (Secret key, Hex):</label>
                <input type="text" id="privateKeyHex" placeholder="예: 30... (Signature 방식)">
            </div>
            <div class="form-group">
                <label for="user_id_token">User ID:</label>
                <input type="text" id="user_id_token" placeholder="User ID 입력">
            </div>
            <button id="btnGetToken" onclick="withLoading(this, getAccessToken)">Access Token 발급</button>
            <div class="form-group" style="display:flex;gap:8px;margin-top:10px;">
                <button type="button" onclick="openCredentialSaveModal()" style="width:auto;flex:1;">인증 저장</button>
                <button type="button" onclick="openCredentialLoadModal()" style="width:auto;flex:1;">인증 불러오기</button>
            </div>
            <div class="form-group">
                <label for="accessToken">Access Token:</label>
                <textarea id="accessToken" rows="3" readonly></textarea>
            </div>
            <div id="tokenResult"></div>
        </div>

        <div class="section" id="documentInfoSection">
            <h2>문서 정보 조회 (GET /documents/{DOCUMENT_ID})</h2>
            <p>Access Token은 위에서 발급받은 값을 사용합니다.</p>
            <div class="url-display" id="docInfoUrlDisplay">
                API URL: <span id="baseUrlSpan"></span><span id="dynamicDocId">{DOCUMENT_ID}</span>
            </div>
            
            <div class="form-group">
                <label for="documentId">DOCUMENT_ID (필수):</label>
                <input type="text" id="documentId" placeholder="조회할 문서의 ID를 입력하세요">
            </div>

            <div class="form-group">
                <label>Query String 옵션:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="docInfoQs" value="include_fields"><span>필드 포함</span></label>
                    <label><input type="checkbox" name="docInfoQs" value="include_histories"><span>문서 이력 포함</span></label>
                    <label><input type="checkbox" name="docInfoQs" value="include_previous_status"><span>이전 단계 정보 포함</span></label>
                    <label><input type="checkbox" name="docInfoQs" value="include_next_status"><span>다음 단계 정보 포함</span></label>
                    <label><input type="checkbox" name="docInfoQs" value="include_external_token"><span>사용자 Token 포함</span></label>
                    <label><input type="checkbox" name="docInfoQs" value="include_detail_template_info"><span>상세 템플릿 정보 포함</span></label>
                </div>
            </div>
            <button id="btnDocInfo" onclick="withLoading(this, getDocumentInfo)">문서 정보 조회</button>
            <div id="docInfoResult"></div>
        </div>
    </div>

    <script>
        
        const DOMAINS = {
            op_saas: 'https://kr-api.eformsign.com',
            csap: 'https://www.gov-eformsign.com/Service'
        };

        // [수정됨] 현재 선택된 도메인을 가져오는 헬퍼 함수
        function getCurrentDomain() {
            const env = $('#envSelection').val();
            if (env === 'custom') {
                // 입력값에서 뒤쪽 슬래시(/) 제거
                let customUrl = $('#customDomainInput').val().trim();
                return customUrl.replace(/\/+$/, ''); 
            }
            return DOMAINS[env] || '';
        }

        function updateUrlDisplay() {
            const domain = getCurrentDomain();
            
            // 아직 도메인 입력이 안된 경우 처리
            const displayDomain = domain ? domain : '(도메인 미지정)';

            $('#tokenUrlDisplay').text(`Access Token URL: ${displayDomain}/v2.0/api_auth/access_token`);
            $('#baseUrlSpan').text(`${displayDomain}/v2.0/api/documents/`);
        }

        $(document).ready(function() {
            updateUrlDisplay();

            // [수정됨] 환경 선택 변경 시 이벤트 핸들러 수정
            $('#envSelection').change(function() {
                const val = $(this).val();
                if (val === 'custom') {
                    $('#customDomainContainer').show(); // 입력창 보이기
                    $('#customDomainInput').focus();
                } else {
                    $('#customDomainContainer').hide(); // 입력창 숨기기
                }
                updateUrlDisplay();
            });

            // [수정됨] 커스텀 도메인 입력 시 URL 실시간 업데이트
            $('#customDomainInput').on('keyup input', updateUrlDisplay);

            $('input[name="secretKeyMethod"]').change(() => {
                const m = $('input[name="secretKeyMethod"]:checked').val();
                $('#secretKeyLabel').text(m === 'signature' ? '비밀 키 (Secret key, Hex):' : '비밀 토큰:');
                $('#privateKeyHex').attr('placeholder', m === 'signature' ? '예: 30... (Signature 방식)' : '예: test (Bearer token 방식)');
            });
            
            $('#documentId').on('keyup input', function() {
                const docId = $(this).val().trim();
                if (docId) {
                    $('#dynamicDocId').text(docId);
                } else {
                    $('#dynamicDocId').text('{DOCUMENT_ID}');
                }
            });

            $('.checkbox-group input[type="checkbox"]').each(function() {
                $(this).closest('label').toggleClass('selected', this.checked);
            });

            $('.checkbox-group input[type="checkbox"]').on('change', function() {
                $(this).closest('label').toggleClass('selected', this.checked);
            });

            // ?document_id= 쿼리 프리필 (문서 작성 도구의 [문서 정보 조회 →] 링크)
            const prefillId = ResultPanel.getQueryParam('document_id');
            if (prefillId) {
                $('#documentId').val(prefillId).trigger('input');
            }
        });

        async function getAccessToken() {
            const execTime = Date.now();
            const apiKey = $('#apiKey').val().trim();
            const privateKey = $('#privateKeyHex').val().trim();
            const memberId = $('#user_id_token').val().trim();
            const domain = getCurrentDomain(); // [수정됨] 헬퍼 함수 사용

            if (!domain) {
                alert('환경을 선택하거나 커스텀 도메인을 입력해주세요.');
                return;
            }
            if (!apiKey || !privateKey || !memberId) {
                alert('Access Token 발급에 필요한 모든 값을 입력해주세요.');
                return;
            }

            let signature;
            if ($('input[name="secretKeyMethod"]:checked').val() === 'signature') {
                try {
                    const keyObj = KEYUTIL.getKeyFromPlainPrivatePKCS8Hex(privateKey);
                    const sig = new KJUR.crypto.Signature({ alg: 'SHA256withECDSA' });
                    sig.init(keyObj);
                    sig.updateString(execTime.toString());
                    signature = sig.sign();
                } catch (e) {
                    alert('서명 생성 오류: ' + e);
                    return;
                }
            } else {
                signature = 'Bearer ' + privateKey;
            }

            // 서버·외부 응답 문자열은 .text()로만 렌더링한다 (XSS 방지)
            $('#tokenResult').empty().append($('<pre>').text('토큰 발급 중...'));

            const result = await window.issueAccessToken({ domain, apiKey, memberId, signature, execTime });
            if (result.ok) {
                $('#accessToken').val(result.token);
                $('#tokenResult').empty().append($('<pre>').text(JSON.stringify(result.data, null, 2)));
            } else {
                $('#tokenResult').empty().append($('<pre>').text(`에러: ${result.message || '알 수 없는 오류'}`));
            }
        }

        async function getDocumentInfo() {
            const token = $('#accessToken').val().trim();
            const documentId = $('#documentId').val().trim();
            const domain = getCurrentDomain(); // [수정됨] 헬퍼 함수 사용

            if (!domain) {
                alert('환경을 선택하거나 커스텀 도메인을 입력해주세요.'); return;
            }
            if (!token) {
                alert('Access Token을 먼저 발급받아주세요.'); return;
            }
            if (!documentId) {
                alert('DOCUMENT_ID를 입력해주세요.'); return;
            }
            
            const params = new URLSearchParams();
            $('input[name="docInfoQs"]:checked').each(function() {
                params.append($(this).val(), 'true');
            });
            const queryString = params.toString();

            // [수정됨] 도메인 변수 사용
            let url = `${domain}/v2.0/api/documents/${encodeURIComponent(documentId)}`;
            if (queryString) {
                url += `?${queryString}`;
            }

            ResultPanel.renderStatus('#docInfoResult', '조회 중...', [`실행 URL: ${url}`]);

            let response;
            try {
                response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });
            } catch (err) {
                // CORS·도메인 오타·네트워크 실패
                renderApiError('#docInfoResult', { error: err, url, title: '조회 실패' });
                return;
            }

            // 상태 코드를 먼저 확인한 뒤 본문을 해석한다 (HTML 502 응답에서 SyntaxError 방지)
            const resultText = await response.text().catch(() => '');
            if (!response.ok) {
                renderApiError('#docInfoResult', { status: response.status, bodyText: resultText, url, title: '조회 실패' });
                return;
            }
            let resultJson;
            try {
                resultJson = JSON.parse(resultText);
            } catch (_) {
                renderApiError('#docInfoResult', { status: response.status, bodyText: resultText, url, title: '응답 해석 실패' });
                return;
            }

            // 문서 필드·제목 등은 외부 서명자가 입력한 값이므로 반드시 텍스트로 표시 (ResultPanel은 textContent 사용)
            ResultPanel.render('#docInfoResult', resultJson, {
                title: '조회 완료',
                status: 'ok',
                statusText: `HTTP ${response.status}`,
                filename: 'DocumentInfo',
                meta: [`실행 URL: ${url}`]
            });
        }
    </script>
<script>
window.CREDENTIAL_CONFIG = {
    apiKeyId:         'apiKey',
    userIdId:         'user_id_token',
    secretKeyId:      'privateKeyHex',
    envId:            'envSelection',
    envFixed:         null,
    envSaveMap:       null,
    envLoadMap:       null,
    customUrlId:      null,
    secretMethodId:   'secretKeyMethod',
    secretMethodType: 'radio',
};
</script>
<script src="/assets/js/credential-panel.js"></script>
<script src="https://js.pusher.com/8.0/pusher.min.js"></script>
<script src="/assets/js/auth-status.js"></script>
</body>
</html>
